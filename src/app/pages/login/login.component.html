<div class="login-page">

  <!-- Left Side -->
  <div class="login-left">

    <div class="brand">

      <div class="logo">
        🌿📦
      </div>

      <h1>CourierFlow</h1>

      <p>
        Smart Courier Management System
      </p>

    </div>

    <div class="features">

      <div class="feature">
        🚚 Fast Parcel Tracking
      </div>

      <div class="feature">
        📦 Secure Shipment Management
      </div>

      <div class="feature">
        🌍 Multi Branch Operations
      </div>

      <div class="feature">
        ✔ Real-Time Delivery Updates
      </div>

    </div>

  </div>

  <!-- Right Side -->
  <div class="login-right">

    <div class="login-card">

      <h2>Welcome Back 👋</h2>

      <p class="subtitle">
        Login to continue
      </p>

      <p class="message" *ngIf="message">
        {{ message }}
      </p>

      <div class="input-group">

        <label>Username</label>

        <input
          type="text"
          placeholder="Enter Username"
          [(ngModel)]="username">

      </div>

      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          placeholder="Enter Password"
          [(ngModel)]="password">

      </div>

      <div class="options">

        <label class="remember">

          <input type="checkbox">

          Remember Me

        </label>

        <a href="#">
          Forgot Password?
        </a>

      </div>

      <button class="login-btn" (click)="login()">
        Login →
      </button>

      <p class="register-link">

        Don't have an account?

        <a routerLink="/register">
          Register
        </a>

      </p>

    </div>

  </div>

</div>
